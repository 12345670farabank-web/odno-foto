<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ОДНО ФОТО</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
      background: white;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 15px;
      letter-spacing: 2px;
    }

    header p {
      max-width: 600px;
      margin: 0 auto 30px;
      color: #666;
      line-height: 1.5;
    }

    button {
      border: 0;
      background: #111;
      color: white;
      padding: 14px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin: 5px;
    }

    .upload {
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    .upload input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .hidden {
      display: none;
    }

    .gallery-section {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .photo-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .photo-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .photo-info {
      padding: 12px;
    }

    .photo-info p {
      margin: 5px 0;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>ОДНО ФОТО</h1>

  <p>
    У каждого человека есть только одна фотография.
    Оставь здесь момент, который хочешь сохранить.
  </p>

  <button id="openUploadBtn">ОСТАВИТЬ ФОТО</button>
  <button id="randomBtn">СЛУЧАЙНОЕ ФОТО</button>
</header>

<section id="upload" class="upload hidden">

  <h2>Оставь свою фотографию</h2>

  <input type="file" id="photoInput" accept="image/*">

  <input
    type="text"
    id="cityInput"
    placeholder="Город — необязательно"
  >

  <input
    type="text"
    id="captionInput"
    placeholder="Подпись — необязательно"
  >

  <button id="saveBtn">СОХРАНИТЬ ФОТО</button>

  <p id="uploadStatus"></p>

</section>

<section class="gallery-section">

  <h2>ПОСЛЕДНИЕ ФОТО</h2>

  <div id="gallery" class="gallery">
    Загружаем фотографии...
  </div>

</section>

<script>

const SUPABASE_URL = "https://nnymuczbnpmcylsxsbvc.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_21uVPPJ3SSWWVPT4ppv86Q_EFEGHwnB";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const uploadSection = document.getElementById("upload");
const uploadStatus = document.getElementById("uploadStatus");

document.getElementById("openUploadBtn").addEventListener("click", function () {
  uploadSection.classList.toggle("hidden");
});

document.getElementById("saveBtn").addEventListener("click", uploadPhoto);

document.getElementById("randomBtn").addEventListener("click", randomPhoto);

async function uploadPhoto() {

  const file =
    document.getElementById("photoInput").files[0];

  const city =
    document.getElementById("cityInput").value.trim();

  const caption =
    document.getElementById("captionInput").value.trim();

  if (!file) {

    uploadStatus.textContent =
      "Сначала выбери фотографию.";

    return;
  }

  uploadStatus.textContent =
    "Загружаем фотографию...";

  const safeName =
    file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

  const fileName =
    Date.now() + "-" + safeName;

  const uploadResult =
    await supabaseClient
      .storage
      .from("photos")
      .upload(fileName, file);

  if (uploadResult.error) {

    console.error(uploadResult.error);

    uploadStatus.textContent =
      "Ошибка загрузки фотографии.";

    return;
  }

  const publicResult =.storage
      .from("photos")
      .getPublicUrl(fileName);

  const imageUrl =
    publicResult.data.publicUrl;

  const insertResult =
    await supabaseClient
      .from("photos")
      .insert({

        image_url: imageUrl,

        city: city,

        caption: caption

      });

  if (insertResult.error) {

    console.error(insertResult.error);

    uploadStatus.textContent =
      "Фото загрузилось, но не удалось сохранить данные.";

    return;
  }

  uploadStatus.textContent =
    "Готово! Фотография появилась в галерее.";

  document.getElementById("photoInput").value = "";
  document.getElementById("cityInput").value = "";
  document.getElementById("captionInput").value = "";

  loadPhotos();

}

async function loadPhotos() {

  const gallery =
    document.getElementById("gallery");

  const result =
    await supabaseClient
      .from("photos")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (result.error) {

    console.error(result.error);

    gallery.textContent =
      "Не удалось загрузить фотографии.";

    return;
  }

  if (!result.data || result.data.length === 0) {

    gallery.textContent =
      "Пока здесь нет фотографий.";

    return;
  }

  gallery.innerHTML = "";

  result.data.forEach(function (photo) {

    const card =
      document.createElement("div");

    card.className =
      "photo-card";

    const img =
      document.createElement("img");

    img.src =
      photo.image_url;

    img.alt =
      "Фото";

    const info =
      document.createElement("div");

    info.className =
      "photo-info";

    if (photo.city) {

      const city =
        document.createElement("p");

      city.textContent =
        "📍 " + photo.city;

      info.appendChild(city);

    }

    if (photo.caption) {

      const caption =
        document.createElement("p");

      caption.textContent =
        photo.caption;

      info.appendChild(caption);

    }

    card.appendChild(img);

    card.appendChild(info);

    gallery.appendChild(card);

  });

}

async function randomPhoto() {

  const result =
    await supabaseClient
      .from("photos")
      .select("*");

  if (
    result.error ||
    !result.data ||
    result.data.length === 0
  ) {

    alert("Пока нет фотографий.");

    return;
  }

  const photo =
    result.data[
      Math.floor(
        Math.random() * result.data.length
      )
    ];

  let message = "";

  if (photo.city) {

    message +=
      "📍 " + photo.city + "\n\n";

  }

  message +=
    photo.caption || "Без подписи";

  alert(message);

}

loadPhotos();

</script>

</body>
</html> supabaseClient
