<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ОДНО ФОТО</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

header {
    text-align: center;
    padding: 60px 20px 40px;
    background: white;
}

h1 {
    font-size: 48px;
    margin: 0 0 15px;
    letter-spacing: 2px;
}

header p {
    max-width: 600px;
    margin: 0 auto 30px;
    color: #666;
    line-height: 1.5;
}

button {
    border: none;
    background: #111;
    color: white;
    padding: 14px 22px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin: 5px;
}

.upload {
    max-width: 600px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 15px;
}

.upload input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.hidden {
    display: none;
}

.gallery-section {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

.photo-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
}

.photo-card img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    display: block;
}

.photo-info {
    padding: 12px;
}

.photo-info p {
    margin: 5px 0;
    color: #666;
}
</style>
</head>

<body>

<header>

<h1>ОДНО ФОТО</h1>

<p>
У каждого человека есть только одна фотография.
Оставь здесь момент, который хочешь сохранить.
</p>

<button id="openButton">ОСТАВИТЬ ФОТО</button>

<button id="randomButton">СЛУЧАЙНОЕ ФОТО</button>

</header>

<section id="uploadSection" class="upload hidden">

<h2>Оставь свою фотографию</h2>

<input
type="file"
id="photoInput"
accept="image/*"
>

<input
type="text"
id="cityInput"
placeholder="Город — необязательно"
>

<input
type="text"
id="captionInput"
placeholder="Подпись — необязательно"
>

<button id="saveButton">
СОХРАНИТЬ ФОТО
</button>

<p id="status"></p>

</section>

<section class="gallery-section">

<h2>ПОСЛЕДНИЕ ФОТО</h2>

<div id="gallery" class="gallery">
Загружаем фотографии...
</div>

</section>

<script>

var SUPABASE_URL = "https://nnymuczbnpmcylsxsbvc.supabase.co";

var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ueW11Y3pibnBtY3lsc3hzYnZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMTAwMzIsImV4cCI6MjEwNjg4NjAzMn0.B6bppvVW_js-pldCSpJ6kN-NEBLl3dcEQnMiwahzfcE";

var supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

var uploadSection =
document.getElementById("uploadSection");

var statusElement =
document.getElementById("status");

document.getElementById("openButton").onclick =
function() {

uploadSection.classList.toggle("hidden");

};

document.getElementById("saveButton").onclick =
function() {

uploadPhoto();

};

document.getElementById("randomButton").onclick =
function() {

randomPhoto();

};

async function uploadPhoto() {

var file =
document.getElementById("photoInput").files[0];

var city =
document.getElementById("cityInput").value;

var caption =
document.getElementById("captionInput").value;

if (!file) {

statusElement.textContent =
"Сначала выбери фотографию.";

return;

}

statusElement.textContent =
"Загружаем фотографию...";

var fileName =
Date.now() + "-" + file.name;

var uploadResult =
await supabaseClient
.storage
.from("photos")
.upload(fileName, file);

if (uploadResult.error) {

console.log(uploadResult.error);

statusElement.textContent =
"Ошибка загрузки фотографии.";

return;

}

var publicResult =
supabaseClient
.storage
.from("photos")
.getPublicUrl(fileName);

var imageUrl =
publicResult.data.publicUrl;

var databaseResult =
await supabaseClient
.from("photos")
.insert({

image_url: imageUrl,

city: city,

caption: caption

});

if (databaseResult.error) {

console.log(databaseResult.error);

statusElement.textContent =
"Ошибка сохранения данных.";

return;

}

statusElement.textContent =
"Готово! Фотография появилась в галерее.";

document.getElementById("photoInput").value = "";

documentlementById("cityInput").value = "";

document.getElementById("captionInput").value = "";

loadPhotos();

}

async function loadPhotos() {

var gallery =
document.getElementById("gallery");

var result =
await supabaseClient
.from("photos")
.select("*")
.order(
"created_at",
{
ascending: false
}
);

if (result.error) {

console.log(result.error);

gallery.textContent =
"Не удалось загрузить фотографии.";

return;

}

if (!result.data || result.data.length === 0) {

gallery.textContent =
"Пока здесь нет фотографий.";

return;

}

gallery.innerHTML = "";

for (
var i = 0;
i < result.data.length;
i++
) {

var photo =
result.data[i];

var card =
document.createElement("div");

card.className =
"photo-card";

var image =
document.createElement("img");

image.src =
photo.image_url;

image.alt =
"Фото";

var info =
document.createElement("div");

info.className =
"photo-info";

if (photo.city) {

var cityElement =
document.createElement("p");

cityElement.textContent =
"📍 " + photo.city;

info.appendChild(cityElement);

}

if (photo.caption) {

var captionElement =
document.createElement("p");

captionElement.textContent =
photo.caption;

info.appendChild(captionElement);

}

card.appendChild(image);

card.appendChild(info);

gallery.appendChild(card);

}

}

async function randomPhoto() {

var result =
await supabaseClient
.from("photos")
.select("*");

if (
result.error ||
!result.data ||
result.data.length === 0
) {

alert("Пока нет фотографий.");

return;

}

var index =
Math.floor(
Math.random() * result.data.length
);

var photo =
result.data[index];

var message = "";

if (photo.city) {

message =
"📍 " + photo.city + "\n\n";

}

message =
message +
(photo.caption || "Без подписи");

alert(message);

}

loadPhotos();

</script>

</body>
</html>.getE
